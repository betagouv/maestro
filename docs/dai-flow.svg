@startuml
title Envoi DAI sans Module laboratoires

actor Maestro
actor "SFTP" as SFTP
actor Laboratoires order 10

group Via email
  Maestro -> Laboratoires : DAI (email)
end

group Via SFTP, toutes les heures
  Maestro -> SFTP : zip DA01 (un dossier par labo) + Decl_
  Laboratoires -> SFTP : récupération DAI
end

@enduml

