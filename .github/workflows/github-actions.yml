name: Node.js CI

on: [push]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm
      - name: NPM install
        run: npm ci
      - name: Run Biome
        run: npx biome ci . --error-on-warnings
      - name: Run Knip
        run: npm run knip
      - name: build
        run: npm run build --workspaces
      - name: Shared tests
        run: npm -w shared test
  server_test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maestro
        ports:
          - 5432:5432
        options: --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      s3:
        image: adobe/s3mock:3.5.2
        ports:
          - 9090:9090
        env:
          initialBuckets: 'maestro'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm
      - name: Server install
        run: npm ci
      - name: Server tests
        run: npm run test -w server
        env:
          AUTH_SECRET: abcd1234
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/maestro
          M2M_BASIC_TOKEN: fakeBasicToken
  frontend_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm
      - name: NPM install
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/package-lock.json', 'package-lock.json') }}
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright system deps only
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - name: Frontend tests
        run: npm -w frontend test -- --test-timeout=30000
  release:
    if: github.ref == 'refs/heads/prod'
    needs: [check, server_test, frontend_test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          TCHAP_HOMESERVER_URL: ${{ secrets.TCHAP_HOMESERVER_URL }}
          TCHAP_ACCESS_TOKEN: ${{ secrets.TCHAP_ACCESS_TOKEN }}
          TCHAP_ROOM_ID: ${{ secrets.TCHAP_ROOM_ID }}
        run: npx --package semantic-release@25.0.3 semantic-release
