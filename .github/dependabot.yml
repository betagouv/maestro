version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # Location of package.json
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      sentry:
        patterns:
          - "@sentry/*"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-pwa"
        update-types:
          - "minor"
          - "patch"
      mui:
        patterns:
          - "@mui/*"
          - "@emotion/*"
        update-types:
          - "minor"
          - "patch"
      maplibre:
        patterns:
          - "maplibre-gl"
          - "react-map-gl"
        update-types:
          - "minor"
          - "patch"
      date-fns:
        patterns:
          - "date-fns"
          - "date-fns-tz"
        update-types:
          - "minor"
          - "patch"
      mail:
        patterns:
          - "imapflow"
          - "mailparser"
          - "nodemailer"
          - "@types/nodemailer"
        update-types:
          - "minor"
          - "patch"
      fast-xml:
        patterns:
          - "fast-xml-parser"
          - "fast-xml-builder"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
